<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growth'High 전체 지원사업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  :root{
    --brand:#1246D6; --brand-dark:#0E37A8; --brand-soft:#EEF3FF; --brand-line:#D6E1FF;
    --ink-900:#0B1020; --ink-700:#2A3145; --ink-500:#5A6478; --ink-400:#8A93A6; --ink-300:#B4BBC9;
    --bg:#FFFFFF; --bg-soft:#F7F9FC; --line:#EAEEF4; --line-card:#E3E8F0;
    --urgent:#E0431F; --urgent-soft:#FDEEEA; --warn:#B45309; --warn-soft:#FEF4E5; --closed:#9AA3B2;
    --ok:#0E9F6E; --ok-soft:#E7F8F1;
    --sh-sm:0 1px 2px rgba(11,16,32,.04);
    --sh-md:0 4px 16px rgba(11,16,32,.06),0 1px 3px rgba(11,16,32,.04);
    --r:18px;
  }
  *{box-sizing:border-box;}
  body{font-family:'Pretendard Variable',Pretendard,sans-serif;background:var(--bg);color:var(--ink-700);margin:0;-webkit-font-smoothing:antialiased;}
  .doc{max-width:1120px;margin:0 auto;padding:0 28px 140px;}
  .brand-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;padding:16px 0;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);}
  .brand-mark{display:flex;align-items:center;gap:11px;}
  .brand-mark .brand-logo{width:30px;height:30px;object-fit:contain;border-radius:8px;}
  .brand-mark .wordmark{font-size:17px;font-weight:800;letter-spacing:-.045em;color:var(--ink-900);}
  .brand-mark .apostrophe{color:var(--urgent);font-weight:800;}
  .brand-mark .tagline{font-size:11px;font-weight:600;color:var(--ink-300);padding-left:11px;margin-left:3px;border-left:1px solid var(--line);}
  .nav-links{display:none;}
  .crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;margin:24px 0 0;}
  .crumb a{color:var(--ink-400);text-decoration:none;padding:4px 9px;border-radius:8px;transition:.15s;}
  .crumb a:hover{color:var(--brand);background:var(--brand-soft);}
  .crumb .sep{color:var(--ink-300);}
  .crumb .current{color:var(--ink-900);font-weight:700;padding:4px 9px;}
  .hero{padding:40px 0 32px;}
  .hero-title{font-size:42px;font-weight:800;line-height:1.12;letter-spacing:-.045em;color:var(--ink-900);margin:0 0 12px;}
  .hero-title .accent{color:var(--brand);}
  .hero-desc{font-size:15px;color:var(--ink-500);line-height:1.6;margin:0;}
  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:8px;}
  .cat-card{display:block;text-decoration:none;padding:28px;background:var(--bg);border:1px solid var(--line-card);border-radius:var(--r);box-shadow:var(--sh-sm);transition:.18s;}
  .cat-card:hover{box-shadow:var(--sh-md);border-color:var(--ink-300);}
  .cat-card .cat-name{font-size:21px;font-weight:800;letter-spacing:-.035em;color:var(--ink-900);margin-bottom:4px;}
  .cat-card .cat-cnt{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--brand);margin-bottom:12px;}
  .cat-card .cat-subs{font-size:12.5px;color:var(--ink-400);line-height:1.6;}
  .subnav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px;}
  .subnav a{font-size:13px;font-weight:600;padding:8px 15px;background:#fff;border:1px solid var(--line-card);border-radius:999px;color:var(--ink-500);text-decoration:none;transition:.15s;}
  .subnav a:hover{border-color:var(--ink-400);color:var(--ink-900);}
  .subnav a.active{background:var(--ink-900);border-color:var(--ink-900);color:#fff;}
  .subnav a .cnt{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.7;margin-left:6px;}
  .cat-note{margin:18px 0 0;padding:13px 18px;background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:12px;font-size:13px;color:var(--ink-500);line-height:1.55;}
  .cat-note strong{color:var(--brand);font-weight:700;}
  .controls{margin-top:18px;display:flex;flex-direction:column;gap:14px;padding:20px;background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--r);}
  .search-wrap{position:relative;}
  .search-input{width:100%;padding:14px 44px 14px 16px;font-family:inherit;font-size:14.5px;background:#fff;border:1px solid var(--line-card);border-radius:12px;color:var(--ink-700);transition:.15s;}
  .search-input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
  .search-clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ink-300);cursor:pointer;padding:4px 8px;font-size:14px;display:none;border-radius:6px;}
  .search-clear.visible{display:block;}
  .filter-group{display:flex;flex-direction:column;gap:9px;}
  .filter-label{font-size:12px;font-weight:600;color:var(--ink-400);}
  .filter-chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{font-family:inherit;font-size:13px;font-weight:600;padding:8px 15px;background:#fff;border:1px solid var(--line-card);border-radius:999px;color:var(--ink-500);cursor:pointer;transition:.15s;}
  .chip:hover{border-color:var(--ink-400);color:var(--ink-700);}
  .chip.active{background:var(--ink-900);border-color:var(--ink-900);color:#fff;}
  .controls-footer{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap;gap:12px;}
  .result-count{font-size:13px;color:var(--ink-500);}
  .result-count strong{color:var(--ink-900);font-weight:700;}
  .reset-btn{font-size:12.5px;font-weight:600;color:var(--ink-400);background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:8px;transition:.15s;}
  .reset-btn:hover{color:var(--urgent);background:var(--urgent-soft);}
  .reset-btn:disabled{opacity:.3;cursor:not-allowed;}
  .edit-toggle{display:inline-flex;align-items:center;gap:6px;margin-left:10px;padding:7px 13px;font-size:12.5px;font-weight:600;background:var(--brand-soft);color:var(--brand);border:none;border-radius:8px;cursor:pointer;}
  .edit-toggle.on{background:var(--brand);color:#fff;}
  .program-section{margin-top:36px;}
  .program-section.hidden{display:none;}
  .section-header-row{display:flex;align-items:center;gap:9px;margin-bottom:16px;}
  .section-dot{width:7px;height:7px;border-radius:50%;background:var(--brand);}
  .section-dot.closed{background:var(--closed);}
  .section-title{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--ink-900);}
  .section-count{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--ink-400);margin-left:auto;}
  .program-list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .program-card{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line-card);border-radius:var(--r);padding:24px;transition:.18s;box-shadow:var(--sh-sm);}
  .program-card:hover{box-shadow:var(--sh-md);border-color:var(--ink-300);}
  .program-card.is-closed{opacity:.66;}
  .program-card.is-closed:hover{opacity:1;}
  .card-check{position:absolute;top:16px;right:16px;width:26px;height:26px;border-radius:8px;border:2px solid var(--line-card);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;transition:.15s;}
  .card-check:hover{border-color:var(--brand);}
  .card-check.checked{background:var(--brand);border-color:var(--brand);}
  .card-check.checked::after{content:'\2713';color:#fff;font-size:15px;font-weight:800;}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px;}
  .card-tags{display:flex;gap:6px;flex-wrap:wrap;}
  .card-tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;}
  .card-tag.type{background:var(--warn-soft);color:var(--warn);}
  .card-tag.sub{background:var(--ok-soft);color:var(--ok);}
  .card-tag.alt{background:#F1F3F7;color:var(--ink-500);}
  .card-dday{flex-shrink:0;text-align:center;min-width:56px;padding:8px 10px;border-radius:12px;background:var(--bg-soft);}
  .card-dday .dv{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--ink-700);}
  .card-dday.urgent{background:var(--urgent-soft);}.card-dday.urgent .dv{color:var(--urgent);}
  .card-dday.warning{background:var(--warn-soft);}.card-dday.warning .dv{color:var(--warn);}
  .card-dday.closed{background:#EEF0F3;}.card-dday.closed .dv{font-size:13px;color:var(--closed);}
  .card-title{font-size:16.5px;font-weight:700;letter-spacing:-.03em;line-height:1.35;color:var(--ink-900);margin:0 0 8px;}
  .card-summary{font-size:13px;color:var(--ink-500);line-height:1.6;margin:0 0 16px;flex:1;}
  .card-meta-list{display:flex;gap:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-400);flex-wrap:wrap;}
  .card-meta-list .k{color:var(--ink-400);}
  .card-meta-list .v{color:var(--ink-700);font-weight:700;margin-left:5px;}
  .card-meta-list .v.amt{color:var(--brand);font-family:'JetBrains Mono',monospace;}
  .empty-state{padding:56px 24px;background:#fff;border:1px dashed var(--line-card);border-radius:var(--r);text-align:center;color:var(--ink-500);font-size:14px;}
  .empty-state strong{display:block;color:var(--ink-900);font-size:16px;margin-bottom:6px;font-weight:700;}
  .doc-footer{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .footer-brand{font-size:12px;font-weight:700;color:var(--ink-500);}.footer-brand .apostrophe{color:var(--urgent);}
  .footer-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-400);text-align:right;line-height:1.6;}
  .picker-bar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(160%);width:min(680px,calc(100% - 32px));background:var(--ink-900);color:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.28);padding:16px 20px;display:flex;align-items:center;gap:12px;z-index:150;transition:transform .26s cubic-bezier(.2,.8,.2,1);flex-wrap:wrap;}
  .picker-bar.show{transform:translateX(-50%) translateY(0);}
  .picker-count{font-size:14px;font-weight:700;white-space:nowrap;}
  .picker-count .n{font-family:'JetBrains Mono',monospace;color:#7DA9FF;}
  .picker-select{flex:1;min-width:150px;padding:10px 12px;font-family:inherit;font-size:13.5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:10px;color:#fff;}
  .picker-select option{color:#111;}
  .picker-input{flex:1;min-width:150px;padding:10px 12px;font-family:inherit;font-size:13.5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:10px;color:#fff;display:none;}
  .picker-input::placeholder{color:rgba(255,255,255,.5);}
  .picker-btn{padding:10px 18px;font-family:inherit;font-size:13.5px;font-weight:700;background:var(--brand);color:#fff;border:none;border-radius:10px;cursor:pointer;white-space:nowrap;}
  .picker-btn:hover{background:var(--brand-dark);}
  .picker-btn:disabled{opacity:.4;cursor:not-allowed;}
  .picker-clear{background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:13px;padding:6px;}
  .picker-clear:hover{color:#fff;}
  .picker-msg{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:151;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.2);}
  .picker-msg.show{opacity:1;}
  .picker-msg.err{background:var(--urgent);}
  @media(max-width:860px){
    .doc{padding:0 16px 80px;}
    .cat-grid{grid-template-columns:1fr;}
    .program-list{grid-template-columns:1fr;}
    .hero-title{font-size:32px;}
  }
</style>

<body>
<div class="doc">

  <header class="brand-header">
    <div class="brand-mark">
      <img src="logo.png" alt="GROWTH'HIGH" class="brand-logo" onerror="this.style.display='none'">
      <span class="wordmark">GROWTH<span class="apostrophe">'</span>HIGH</span>
      <span class="tagline">Scale-up Studio</span>
    </div>
  </header>

  <nav class="crumb" id="crumb"></nav>

  <div class="hero">
    <h1 class="hero-title" id="page-title">그로스하이 정부지원사업 DB</h1>
    <p class="hero-desc" id="page-desc">업종·유형별로 정리된 정부지원사업 전체. 진행·종료 포함.</p>
  </div>

  <!-- 전체 화면: 상위 업종 카드 -->
  <div class="cat-grid" id="cat-grid" style="display:none;"></div>

  <!-- 상위 업종 화면: 세부업종 네비 -->
  <nav class="subnav" id="subnav" style="display:none;"></nav>

  <!-- 세부업종 화면 안내문 -->
  <div class="cat-note" id="cat-note" style="display:none;"></div>

  <div class="controls" id="controls">
    <div class="search-wrap">
      <input type="text" id="search-input" class="search-input" placeholder="사업명, 키워드, 운영기관 검색..." autocomplete="off">
      <button id="search-clear" class="search-clear" title="검색어 지우기">✕</button>
    </div>
    <div class="filter-group" id="type-filter-group">
      <label class="filter-label">유형</label>
      <div class="filter-chips" id="type-chips"></div>
    </div>
    <div class="filter-group" id="sort-filter-group">
      <label class="filter-label">정렬</label>
      <div class="filter-chips" id="sort-chips">
        <button class="chip active" data-sort="dday">마감임박순</button>
        <button class="chip" data-sort="added">최근 발행순</button>
      </div>
    </div>
    <div class="filter-group" id="recent-filter-group">
      <label class="filter-label">신규</label>
      <div class="filter-chips">
        <button class="chip" id="recent-toggle">최근 3일 신규만</button>
      </div>
    </div>
    <div class="controls-footer">
      <div class="result-count" id="result-count"></div>
      <button id="reset-btn" class="reset-btn" disabled>↺ 전체 해제</button><button class="edit-toggle" id="edit-toggle">+ 재생목록 담기 모드</button>
    </div>
  </div>

  <section class="program-section" id="active-section">
    <div class="section-header-row">
      <span class="section-dot"></span>
      <div class="section-title">진행 중인 사업</div>
      <div class="section-count" id="active-cnt">0</div>
    </div>
    <div class="program-list" id="active-list"></div>
  </section>

  <section class="program-section" id="closed-section">
    <div class="section-header-row">
      <span class="section-dot closed"></span>
      <div class="section-title">종료된 사업 (참고용)</div>
      <div class="section-count" id="closed-cnt">0</div>
    </div>
    <div class="program-list" id="closed-list"></div>
  </section>

  <div class="empty-state" id="empty-state" style="display:none;">
    <strong>표시할 사업이 없습니다</strong>
    검색어나 필터를 변경해 보세요.
  </div>

  <footer class="doc-footer">
    <div class="footer-brand">GROWTH<span class="apostrophe">'</span>HIGH — Scale-up Studio</div>
    <div class="footer-meta">Curated by GROWTH'HIGH<br><span id="footer-updated"></span></div>
  </footer>

</div>

<script>
(() => {
  'use strict';

  // ── 업종 계층 정의 ──
  const TOP_INDUSTRIES = ['제조업', '지식서비스업', '게임개발업'];
  const SUB_MAP = {
    '제조업': ['뷰티','라이프','푸드','패션','반도체/소부장','스포츠','로봇','바이오헬스케어']
    // 지식서비스업/게임개발업 세부는 추후 추가
  };

  let state = { programs: [], filters: { types: [] }, selType: new Set(), search: '', cat: '', updated_at: '', sort: 'dday', recentOnly: false, recentDays: 3 };

  function daysSince(dateStr) {
    if (!dateStr) return Infinity;
    const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' });
    const toUTC = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
    return Math.round((toUTC(fmt.format(new Date())) - toUTC(dateStr)) / 86400000);
  }

  function calcDday(isoStr) {
    if (!isoStr) return 9999;
    const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' });
    const toUTC = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
    const dlMs = toUTC(fmt.format(new Date(isoStr)));
    const nowMs = toUTC(fmt.format(new Date()));
    return Math.round((dlMs - nowMs) / 86400000);
  }
  function getStatus(dday) { if (dday < 0) return 'closed'; if (dday <= 3) return 'urgent'; if (dday <= 7) return 'warning'; return 'active'; }
  function statusLabel(dday, st) { if (st === 'closed') return 'REF'; if (st === 'urgent') return 'URGENT'; if (st === 'warning') return 'WARNING'; return 'ACTIVE'; }
  function ddayText(dday, st) { if (st === 'closed') return 'CLOSED'; if (dday === 0) return 'D−0'; if (dday >= 9999) return '상시'; return 'D−' + dday; }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderCard(p) {
    const dday = calcDday(p.deadline_iso);
    const st = getStatus(dday);
    const subTags = (p.sub_industries || []).map(s => '<span class="card-tag sub">' + esc(s) + '</span>').join('');
    const typeTags = (p.types || []).map(t => '<span class="card-tag type">' + esc(t) + '</span>').join('');
    const tagsHtml = typeTags + subTags;
    const metaHtml = Object.entries(p.meta || {}).map(([k, v]) => '<span><span class="k">' + esc(k) + '</span><span class="v' + (/\uc9c0\uc6d0|\ud55c\ub3c4|\uae08\uc561/.test(k) ? ' amt' : '') + '">' + esc(v) + '</span></span>').join('');
    const slug = p.file.replace(/\.html$/, '');
    const chk = window.EDIT_MODE ? '<div class="card-check' + (window.PICKED && window.PICKED.has(slug) ? ' checked' : '') + '" data-slug="' + esc(slug) + '" onclick="window.togglePick(event, this)"></div>' : '';
    const ddayCls = st === 'closed' ? 'closed' : (st === 'urgent' ? 'urgent' : (st === 'warning' ? 'warning' : ''));
    const ddayVal = st === 'closed' ? '\uc885\ub8cc' : ddayText(dday, st);
    return '<a href="' + esc(p.file) + '" target="_blank" rel="noopener" class="program-card' + (st === 'closed' ? ' is-closed' : '') + '">' + chk +
      '<div class="card-head"><div class="card-tags">' + tagsHtml + '</div><div class="card-dday ' + ddayCls + '"><div class="dv">' + ddayVal + '</div></div></div>' +
      '<h3 class="card-title">' + esc(p.title) + '</h3>' +
      '<p class="card-summary">' + esc(p.summary || '') + '</p>' +
      '<div class="card-meta-list">' + metaHtml + '</div></a>';
  }

  function matchesSearch(p, q) {
    if (!q) return true;
    const hay = [p.title, p.summary, ...(p.tags||[]), ...(p.industries||[]), ...(p.sub_industries||[]), ...(p.types||[])].join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).every(t => hay.includes(t));
  }

  // 현재 cat에 해당하는 사업 추출
  function inCat(p) {
    if (!state.cat) return true;                       // 전체
    if (TOP_INDUSTRIES.includes(state.cat)) return (p.industries||[]).includes(state.cat);
    // 세부업종 화면: 해당 세부업종 + (그 상위 업종이면서 세부 미지정 = 일반/공통) 모두 포함
    const top = topOfSub(state.cat);
    if ((p.sub_industries||[]).includes(state.cat)) return true;
    if (top && (p.industries||[]).includes(top) && !(p.sub_industries||[]).length) return true;
    return false;
  }
  // 이 사업이 현재 cat의 "특화"인지(세부 태그 보유) 여부
  function isSpecific(p) {
    if (!state.cat || TOP_INDUSTRIES.includes(state.cat)) return true;
    return (p.sub_industries||[]).includes(state.cat);
  }
  function matchesType(p) { if (state.selType.size === 0) return true; return (p.types||[]).some(t => state.selType.has(t)); }
  function matchesRecent(p) { if (!state.recentOnly) return true; if (!p.added_at) return false; return daysSince(p.added_at) <= state.recentDays; }

  function topOfSub(sub) { for (const [top, subs] of Object.entries(SUB_MAP)) if (subs.includes(sub)) return top; return ''; }

  function buildCrumb() {
    const c = document.getElementById('crumb');
    let html = '<a href="?">전체 지원사업</a>';
    if (state.cat && TOP_INDUSTRIES.includes(state.cat)) {
      html += '<span class="sep">›</span><span class="current">' + esc(state.cat) + '</span>';
    } else if (state.cat) {
      const top = topOfSub(state.cat);
      if (top) html += '<span class="sep">›</span><a href="?cat=' + encodeURIComponent(top) + '">' + esc(top) + '</a>';
      html += '<span class="sep">›</span><span class="current">' + esc(state.cat) + '</span>';
    }
    c.innerHTML = html;
  }

  function countFor(catName) {
    return state.programs.filter(p => {
      if (TOP_INDUSTRIES.includes(catName)) return (p.industries||[]).includes(catName);
      return (p.sub_industries||[]).includes(catName);
    }).length;
  }

  function buildCatGrid() {
    const g = document.getElementById('cat-grid');
    g.innerHTML = TOP_INDUSTRIES.map(top => {
      const subs = SUB_MAP[top] || [];
      const subText = subs.length ? subs.join(' · ') : '세부 분류 준비 중';
      return '<a class="cat-card" href="?cat=' + encodeURIComponent(top) + '"><div class="cat-name">' + esc(top) + '</div><div class="cat-cnt">' + countFor(top) + '개 사업</div><div class="cat-subs">' + esc(subText) + '</div></a>';
    }).join('');
  }

  function buildSubnav() {
    const nav = document.getElementById('subnav');
    const top = TOP_INDUSTRIES.includes(state.cat) ? state.cat : topOfSub(state.cat);
    const subs = SUB_MAP[top] || [];
    if (!subs.length) { nav.style.display = 'none'; return; }
    let html = '<a href="?cat=' + encodeURIComponent(top) + '"' + (state.cat === top ? ' class="active"' : '') + '>전체<span class="cnt">' + countFor(top) + '</span></a>';
    html += subs.map(s => '<a href="?cat=' + encodeURIComponent(s) + '"' + (state.cat === s ? ' class="active"' : '') + '>' + esc(s) + '<span class="cnt">' + countFor(s) + '</span></a>').join('');
    nav.innerHTML = html;
    nav.style.display = 'flex';
  }

  function renderTypeChips() {
    const el = document.getElementById('type-chips');
    el.innerHTML = state.filters.types.map(t => '<button class="chip' + (state.selType.has(t) ? ' active' : '') + '" data-value="' + esc(t) + '">' + esc(t) + '</button>').join('');
    el.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
      const v = ch.dataset.value;
      if (state.selType.has(v)) { state.selType.delete(v); ch.classList.remove('active'); }
      else { state.selType.add(v); ch.classList.add('active'); }
      render();
    }));
  }

  function render() {
    const pool = state.programs.filter(p => inCat(p) && matchesSearch(p, state.search) && matchesType(p) && matchesRecent(p));
    const active = [], closed = [];
    pool.forEach(p => { (getStatus(calcDday(p.deadline_iso)) === 'closed' ? closed : active).push(p); });
    // 세부업종 화면이면: 특화(세부태그 보유)를 위로, 그 안에서 선택된 정렬 기준
    const subView = state.cat && !TOP_INDUSTRIES.includes(state.cat);
    const byAdded = (a, b) => (b.added_at || '').localeCompare(a.added_at || '');
    const activeField = state.sort === 'added' ? byAdded : (a, b) => calcDday(a.deadline_iso) - calcDday(b.deadline_iso);
    const closedField = state.sort === 'added' ? byAdded : (a, b) => calcDday(b.deadline_iso) - calcDday(a.deadline_iso);
    active.sort((a, b) => {
      if (subView) {
        const sa = isSpecific(a) ? 0 : 1, sb = isSpecific(b) ? 0 : 1;
        if (sa !== sb) return sa - sb;
      }
      return activeField(a, b);
    });
    closed.sort((a, b) => {
      if (subView) { const sa = isSpecific(a)?0:1, sb = isSpecific(b)?0:1; if (sa!==sb) return sa-sb; }
      return closedField(a, b);
    });

    document.getElementById('active-list').innerHTML = active.map(renderCard).join('');
    document.getElementById('closed-list').innerHTML = closed.map(renderCard).join('');
    document.getElementById('active-cnt').textContent = active.length;
    document.getElementById('closed-cnt').textContent = closed.length;
    document.getElementById('active-section').classList.toggle('hidden', active.length === 0);
    document.getElementById('closed-section').classList.toggle('hidden', closed.length === 0);
    document.getElementById('empty-state').style.display = pool.length === 0 ? 'block' : 'none';

    // 세부업종 화면 안내문
    const note = document.getElementById('cat-note');
    if (subView) {
      const spec = pool.filter(isSpecific).length;
      note.style.display = 'block';
      note.innerHTML = '<strong>' + esc(state.cat) + '</strong> 특화 ' + spec + '개 + 전 업종·일반 제조 공통 ' + (pool.length - spec) + '개를 함께 표시합니다. (공통 사업도 ' + esc(state.cat) + ' 기업이 지원 가능)';
    } else {
      note.style.display = 'none';
    }

    const total = state.programs.filter(inCat).length;
    const rc = document.getElementById('result-count');
    rc.innerHTML = (pool.length === total)
      ? '전체 <strong>' + total + '</strong>개 (진행 ' + active.length + ' · 종료 ' + closed.length + ')'
      : '<strong>' + total + '</strong>개 中 <strong>' + pool.length + '</strong>개 표시';
    document.getElementById('reset-btn').disabled = !(state.search || state.selType.size || state.sort !== 'dday' || state.recentOnly);
  }

  function applyView() {
    const isTop = TOP_INDUSTRIES.includes(state.cat);
    const isSub = state.cat && !isTop;
    const isAll = !state.cat;

    document.getElementById('cat-grid').style.display = isAll ? 'grid' : 'none';
    buildCrumb();

    // 제목
    const t = document.getElementById('page-title'), d = document.getElementById('page-desc');
    if (isAll) { t.innerHTML = '전체 지원사업'; d.textContent = '진행 중 · 종료된 사업을 모두 모았습니다.'; }
    else { t.innerHTML = esc(state.cat) + ' 지원사업'; d.textContent = state.cat + ' 분야 지원사업 (종료 포함).'; }

    if (isAll) buildCatGrid();
    if (isTop || isSub) buildSubnav(); else document.getElementById('subnav').style.display = 'none';
  }

  function bindSearch() {
    const si = document.getElementById('search-input'), sc = document.getElementById('search-clear');
    let timer;
    si.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { state.search = si.value.trim(); sc.classList.toggle('visible', !!state.search); render(); }, 200); });
    si.addEventListener('keydown', e => { if (e.key === 'Escape') { si.value = ''; state.search = ''; sc.classList.remove('visible'); render(); } });
    sc.addEventListener('click', () => { si.value = ''; state.search = ''; sc.classList.remove('visible'); si.focus(); render(); });

    document.querySelectorAll('#sort-chips .chip').forEach(ch => ch.addEventListener('click', () => {
      state.sort = ch.dataset.sort;
      document.querySelectorAll('#sort-chips .chip').forEach(c => c.classList.toggle('active', c === ch));
      render();
    }));
    document.getElementById('recent-toggle').addEventListener('click', (e) => {
      state.recentOnly = !state.recentOnly;
      e.currentTarget.classList.toggle('active', state.recentOnly);
      render();
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      si.value = ''; state.search = ''; sc.classList.remove('visible'); state.selType.clear();
      state.sort = 'dday'; state.recentOnly = false;
      document.querySelectorAll('#type-chips .chip.active').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('#sort-chips .chip').forEach(c => c.classList.toggle('active', c.dataset.sort === 'dday'));
      document.getElementById('recent-toggle').classList.remove('active');
      render();
    });
  }

  async function init() {
    try {
      const res = await fetch('data-full.json?v=' + Date.now());
      const data = await res.json();
      state.programs = data.programs;
      state.filters = data.filters || { types: [] };
      if (!state.filters.types) state.filters.types = [];
      state.updated_at = data.updated_at || '';
      state.cat = new URLSearchParams(location.search).get('cat') || '';
      const fu = document.getElementById('footer-updated');
      if (fu) fu.textContent = (data.updated_at || '').replace(/-/g, '.');
      applyView();
      renderTypeChips();
      bindSearch();
      window.renderRef = render;
      render();
    } catch (err) {
      console.error('load fail', err);
      document.getElementById('active-list').innerHTML = '<div class="empty-state"><strong>데이터를 불러올 수 없습니다</strong>잠시 후 다시 시도해 주세요.</div>';
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

<!-- 재생목록 담기 바 (편집 모드) -->
<div class="picker-bar" id="picker-bar">
  <span class="picker-count"><span class="n" id="pick-n">0</span>개 선택됨</span>
  <select class="picker-select" id="pick-select"></select>
  <input class="picker-input" id="pick-input" placeholder="새 재생목록 이름 입력">
  <button class="picker-btn" id="pick-save" disabled>담기</button>
  <button class="picker-clear" id="pick-cancel">선택 해제</button>
</div>
<div class="picker-msg" id="picker-msg"></div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, EDIT_PASSCODE } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.PICKED = new Set();
window.EDIT_MODE = false;
let authed = false;

const $ = id => document.getElementById(id);
const BRIEFING_PREFIX = '브리핑_';
function displayListName(id) { return id.startsWith(BRIEFING_PREFIX) ? '브리핑 ' + id.slice(BRIEFING_PREFIX.length) : id; }
function todayKSTParts() {
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' });
  const [y, m, d] = fmt.format(new Date()).split('-');
  return { display: y + '.' + m + '.' + d, key: BRIEFING_PREFIX + y.slice(2) + m + d };
}
function showMsg(text, isErr) {
  const m = $('picker-msg'); m.textContent = text; m.className = 'picker-msg show' + (isErr ? ' err' : '');
  setTimeout(() => m.classList.remove('show'), 2600);
}

// 재생목록 목록 로드 — 드롭다운 맨 위에 "오늘 브리핑"을 항상 자동으로 넣는다(타이핑 없이 담기)
async function loadPlaylists() {
  const sel = $('pick-select');
  sel.innerHTML = '<option value="">재생목록 선택...</option>';
  const today = todayKSTParts();

  const briefingGroup = document.createElement('optgroup'); briefingGroup.label = '브리핑';
  const todayOpt = document.createElement('option'); todayOpt.value = today.key; todayOpt.textContent = '📅 오늘 브리핑 (' + today.display + ')';
  briefingGroup.appendChild(todayOpt);

  const listGroup = document.createElement('optgroup'); listGroup.label = '재생목록';
  try {
    const snap = await getDocs(collection(db, 'playlists'));
    snap.forEach(d => {
      if (d.id === today.key) return; // 오늘 브리핑은 이미 위에 있음, 중복 방지
      const o = document.createElement('option'); o.value = d.id; o.textContent = displayListName(d.id);
      (d.id.startsWith(BRIEFING_PREFIX) ? briefingGroup : listGroup).appendChild(o);
    });
  } catch(e) { console.error(e); }
  const newOpt = document.createElement('option'); newOpt.value = '__new__'; newOpt.textContent = '+ 새 재생목록 만들기';
  listGroup.appendChild(newOpt);

  sel.appendChild(briefingGroup);
  sel.appendChild(listGroup);
}

window.togglePick = function(ev, el) {
  ev.preventDefault(); ev.stopPropagation();
  const slug = el.dataset.slug;
  if (window.PICKED.has(slug)) { window.PICKED.delete(slug); el.classList.remove('checked'); }
  else { window.PICKED.add(slug); el.classList.add('checked'); }
  updateBar();
};

function updateBar() {
  const n = window.PICKED.size;
  $('pick-n').textContent = n;
  $('picker-bar').classList.toggle('show', window.EDIT_MODE && n > 0);
  $('pick-save').disabled = n === 0 || !$('pick-select').value;
}

$('edit-toggle').addEventListener('click', () => {
  window.EDIT_MODE = !window.EDIT_MODE;
  $('edit-toggle').classList.toggle('on', window.EDIT_MODE);
  $('edit-toggle').textContent = window.EDIT_MODE ? '✓ 담기 모드 ON' : '+ 재생목록 담기 모드';
  if (window.EDIT_MODE && !authed) { authed = true; loadPlaylists(); }
  if (window.renderRef) window.renderRef();
  $('picker-bar').classList.toggle('show', window.EDIT_MODE && window.PICKED.size > 0);
});

$('pick-select').addEventListener('change', () => {
  const v = $('pick-select').value;
  $('pick-input').style.display = v === '__new__' ? 'block' : 'none';
  $('pick-save').disabled = window.PICKED.size === 0 || !v;
});

$('pick-cancel').addEventListener('click', () => {
  window.PICKED.clear();
  document.querySelectorAll('.card-check.checked').forEach(c => c.classList.remove('checked'));
  updateBar();
});

$('pick-save').addEventListener('click', async () => {
  let name = $('pick-select').value;
  if (name === '__new__') { name = $('pick-input').value.trim(); if (!name) { showMsg('재생목록 이름을 입력하세요', true); return; } }
  if (!name) return;
  // Firestore 문서 ID는 '/'를 허용하지 않는다 — 저장 키는 항상 '_'로 정규화(표시만 displayListName으로 예쁘게).
  name = name.replace(/\//g, '_');
  const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' });
  try {
    const ref = doc(db, 'playlists', name);
    const snap = await getDoc(ref);
    let items = snap.exists() ? (snap.data().items || []) : [];
    const existing = new Set(items.map(i => i.slug));
    let added = 0;
    window.PICKED.forEach(slug => { if (!existing.has(slug)) { items.push({ slug, added_at: today }); added++; } });
    await setDoc(ref, { items, updated_at: today }, { merge: true });
    showMsg('"' + displayListName(name) + '"에 ' + added + '개 담김 (중복 ' + (window.PICKED.size - added) + ')');
    window.PICKED.clear();
    document.querySelectorAll('.card-check.checked').forEach(c => c.classList.remove('checked'));
    updateBar();
    loadPlaylists();
  } catch(e) { console.error(e); showMsg('저장 실패: ' + e.message, true); }
});

window.updatePickerBar = updateBar;
</script>


<div class="fab-wrap" style="position:fixed;right:28px;bottom:28px;z-index:160;display:flex;flex-direction:column;align-items:flex-end;gap:12px;">
  <button class="fab-main" id="fab-main" style="width:54px;height:54px;border-radius:50%;background:var(--ink-900);color:#fff;border:none;font-size:26px;font-weight:300;cursor:pointer;box-shadow:var(--sh-md);transition:.18s;display:flex;align-items:center;justify-content:center;line-height:1;">+</button>
  <div class="fab-menu" id="fab-menu" style="display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;">
    <button class="fab-item" id="fab-pick" style="display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line-card);color:var(--ink-900);font-size:13.5px;font-weight:600;padding:11px 16px;border-radius:12px;cursor:pointer;box-shadow:var(--sh-md);white-space:nowrap;"><span>📋</span> 재생목록 담기</button>
    <a class="fab-item" href="lists.html" style="display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line-card);color:var(--ink-900);font-size:13.5px;font-weight:600;padding:11px 16px;border-radius:12px;text-decoration:none;box-shadow:var(--sh-md);white-space:nowrap;"><span>📁</span> 리스트 보기</a>
  </div>
</div>
<script>
  (function(){
    var m=document.getElementById("fab-main"),menu=document.getElementById("fab-menu");
    m.addEventListener("click",function(){var o=menu.classList.toggle("show");menu.style.opacity=o?"1":"0";menu.style.transform=o?"translateY(0)":"translateY(10px)";menu.style.pointerEvents=o?"auto":"none";m.style.transform=o?"rotate(45deg)":"none";});
    var fp=document.getElementById("fab-pick");
    if(fp)fp.addEventListener("click",function(){var et=document.getElementById("edit-toggle");if(et)et.click();menu.classList.remove("show");menu.style.opacity="0";menu.style.pointerEvents="none";m.style.transform="none";});
  })();
</script>
