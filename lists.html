<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growth'High 재생목록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--accent:#2563EB;--accent-soft:#EEF4FF;--line:#EEF0F2;--line-card:#E8EAEE;--ink-900:#0A0A0A;--ink-700:#1F2937;--ink-500:#4B5563;--ink-400:#6B7280;--ink-300:#9CA3AF;--urgent:#C73E2C;--shadow-sm:0 1px 2px rgba(15,23,42,.04);--shadow-lg:0 8px 24px rgba(15,23,42,.08),0 2px 6px rgba(15,23,42,.04);}
  *{box-sizing:border-box;}
  body{font-family:'Pretendard Variable',Pretendard,sans-serif;background:#fff;color:var(--ink-700);margin:0;}
  .doc{max-width:880px;margin:0 auto;padding:32px 32px 96px;}
  .brand-header{display:flex;align-items:center;justify-content:space-between;padding:0 0 20px;margin-bottom:28px;border-bottom:1px solid var(--line);}
  .nav-links{display:flex;gap:8px;}
  .nav-links a{font-size:13px;font-weight:600;color:var(--ink-500);text-decoration:none;padding:9px 14px;border-radius:10px;transition:all .15s;white-space:nowrap;}
  .nav-links a:hover{background:#F4F5F7;color:var(--ink-900);}
  .nav-links a.active{background:var(--accent-soft);color:var(--accent);}
  .brand-mark{display:flex;align-items:center;gap:10px;}
  .wordmark{font-size:17px;font-weight:800;letter-spacing:-.04em;color:var(--ink-900);}
  .apostrophe{color:var(--urgent);font-weight:800;}
  .tagline{font-size:11px;font-weight:500;color:var(--ink-300);padding-left:12px;margin-left:4px;border-left:1px solid #E5E7EB;}
  .hero{padding:8px 0 28px;}
  .hero-title{font-size:34px;font-weight:800;letter-spacing:-.045em;color:var(--ink-900);margin:0 0 12px;line-height:1.15;}
  .hero-title .accent{color:var(--accent);}
  .hero-desc{font-size:15px;color:var(--ink-500);line-height:1.6;margin:0;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .count-badge{font-size:13px;color:var(--ink-500);}
  .count-badge strong{color:var(--ink-900);font-weight:700;}
  .full-link{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;padding:8px 14px;background:var(--accent-soft);border-radius:10px;}
  .tab-bar{display:flex;gap:6px;margin-bottom:20px;padding:5px;background:#F4F5F7;border-radius:12px;width:fit-content;}
  .tab-btn{font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 18px;background:none;border:none;border-radius:9px;color:var(--ink-500);cursor:pointer;transition:all .15s;}
  .tab-btn.active{background:#fff;color:var(--ink-900);box-shadow:var(--shadow-sm);}
  .type-filter{margin-bottom:20px;padding:16px 18px;background:#fff;border:1px solid var(--line-card);border-radius:14px;}
  .type-filter .tf-label{font-size:12px;font-weight:600;color:var(--ink-400);margin-bottom:10px;display:block;}
  .type-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-family:inherit;font-size:13px;font-weight:500;padding:7px 14px;background:#FAFBFC;border:1px solid var(--line);border-radius:10px;color:var(--ink-500);cursor:pointer;transition:all .15s;user-select:none;}
  .chip:hover{border-color:var(--ink-400);color:var(--ink-700);}
  .chip.active{background:var(--ink-900);border-color:var(--ink-900);color:#fff;}
  .list-grid{display:grid;gap:12px;}
  .list-card{display:flex;align-items:center;gap:18px;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line-card);border-radius:16px;padding:22px 24px;transition:all .2s;box-shadow:var(--shadow-sm);}
  .list-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:#D1D5DB;}
  .list-icon{flex-shrink:0;width:48px;height:48px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:22px;}
  .list-body{flex:1;min-width:0;}
  .list-name{font-size:18px;font-weight:700;letter-spacing:-.03em;color:var(--ink-900);margin-bottom:4px;}
  .list-meta{font-size:12.5px;color:var(--ink-400);display:flex;gap:14px;flex-wrap:wrap;}
  .list-meta .mono{font-family:'JetBrains Mono',monospace;}
  .list-count{flex-shrink:0;text-align:right;}
  .list-count .num{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:var(--accent);line-height:1;}
  .list-count .lbl{font-size:11px;color:var(--ink-400);margin-top:3px;}
  .list-arrow{flex-shrink:0;font-size:18px;color:var(--ink-300);transition:all .2s;}
  .list-card:hover .list-arrow{color:var(--accent);transform:translateX(3px);}
  .list-del{flex-shrink:0;width:34px;height:34px;border-radius:10px;border:1px solid var(--line-card);background:#fff;color:var(--ink-400);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative;z-index:5;}
  .list-del:hover{color:var(--urgent);border-color:#F3C0B6;background:#FDEEEA;}
  .empty-state{padding:56px 24px;background:#fff;border:1px dashed #D1D5DB;border-radius:16px;text-align:center;color:var(--ink-500);font-size:14px;}
  .empty-state strong{display:block;color:var(--ink-900);font-size:16px;margin-bottom:6px;font-weight:700;}
  .loading{padding:56px;text-align:center;color:var(--ink-400);font-size:14px;}
  .doc-footer{margin-top:48px;padding-top:24px;border-top:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink-500);}
  .doc-footer .apostrophe{color:var(--urgent);}
  @media(max-width:720px){.doc{padding:24px 16px 60px;}.hero-title{font-size:26px;}.list-card{padding:18px;gap:14px;}.list-icon{width:40px;height:40px;font-size:18px;}}
</style>
</head>
<body>
<div class="doc">
  <header class="brand-header">
    <div class="brand-mark">
      <span class="wordmark">GROWTH<span class="apostrophe">'</span>HIGH</span>
      <span class="tagline">Scale-up Studio</span>
    </div>
    <nav class="nav-links">
      <a href="full.html">전체 큐레이션</a>
      <a href="lists.html" class="active">재생목록</a>
    </nav>
  </header>

  <div class="hero">
    <h1 class="hero-title">재생목록 <span class="accent">전체</span></h1>
    <p class="hero-desc">담당 컨설턴트가 만든 큐레이션 재생목록입니다. 클릭하면 해당 목록으로 이동합니다.</p>
  </div>

  <div class="tab-bar" id="tab-bar">
    <button class="tab-btn" data-tab="브리핑">📅 브리핑</button>
    <button class="tab-btn active" data-tab="클라이언트">👤 클라이언트</button>
  </div>

  <div class="toolbar">
    <div class="count-badge" id="count-badge"></div>
    <a class="full-link" href="full.html">+ 사업 담으러 가기</a>
  </div>

  <div class="type-filter" id="type-filter" style="display:none;">
    <span class="tf-label">유형으로 재생목록 거르기</span>
    <div class="type-chips" id="type-chips"></div>
  </div>

  <div class="loading" id="loading">재생목록을 불러오는 중...</div>
  <div class="list-grid" id="list-grid"></div>
  <div class="empty-state" id="empty-state" style="display:none;">
    <strong>아직 만든 재생목록이 없습니다</strong>
    전체 큐레이션에서 사업을 체크하고 "담기"로 재생목록을 만들어 보세요.
  </div>

  <footer class="doc-footer">GROWTH<span class="apostrophe">'</span>HIGH — Scale-up Studio</footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ALL_TYPES = ['R&D','창업','판로수출','인력','정책자금','인증','투자유치'];
const BRIEFING_PREFIX = '브리핑_';
function displayName(id){ return id.startsWith(BRIEFING_PREFIX) ? '브리핑 '+id.slice(BRIEFING_PREFIX.length) : id; }
let allLists = [];
let bySlug = {};
let selType = new Set();
let activeTab = '클라이언트';

function renderLists(){
  let lists = allLists.filter(l => l.tab === activeTab);
  if(selType.size) lists = lists.filter(l => [...l.types].some(t=>selType.has(t)));
  const grid = document.getElementById('list-grid');
  if(lists.length===0){
    grid.innerHTML='';
    document.getElementById('empty-state').style.display='block';
    document.getElementById('empty-state').innerHTML = selType.size
      ? '<strong>해당 유형의 재생목록이 없습니다</strong>다른 유형을 선택해 보세요.'
      : (activeTab === '브리핑' ? '<strong>아직 만든 브리핑이 없습니다</strong>full.html에서 담아 "브리핑_YYMMDD" 이름으로 재생목록을 만들어 보세요.' : '<strong>아직 만든 클라이언트 재생목록이 없습니다</strong>전체 큐레이션에서 사업을 체크하고 "담기"로 재생목록을 만들어 보세요.');
    document.getElementById('count-badge').innerHTML='재생목록 <strong>0</strong>개';
    return;
  }
  document.getElementById('empty-state').style.display='none';
  document.getElementById('count-badge').innerHTML = '재생목록 <strong>' + lists.length + '</strong>개' + (selType.size?' (필터됨)':'');
  grid.innerHTML = lists.map(l =>
    '<a class="list-card" href="playlist.html?list=' + encodeURIComponent(l.name) + '">' +
      '<div class="list-icon">📁</div>' +
      '<div class="list-body"><div class="list-name">' + esc(displayName(l.name)) + '</div>' +
      '<div class="list-meta">' + (l.updated ? '<span class="mono">' + esc(l.updated.replace(/-/g,'.')) + ' 수정</span>' : '') + '</div></div>' +
      '<div class="list-count"><div class="num">' + l.count + '</div><div class="lbl">사업</div></div>' +
      '<button class="list-del" title="삭제" onclick="window.deleteList(event,\'' + esc(l.name) + '\')">🗑</button>' +
      '<div class="list-arrow">→</div>' +
    '</a>'
  ).join('');
}

window.deleteList = async function(ev, name){
  ev.preventDefault(); ev.stopPropagation();
  if(!confirm('"'+displayName(name)+'" 재생목록을 삭제할까요?')) return;
  try{
    await deleteDoc(doc(db, 'playlists', name));
    allLists = allLists.filter(l => l.name !== name);
    renderLists();
  }catch(e){ console.error(e); alert('삭제 실패: '+e.message); }
};

function buildTypeChips(){
  const el=document.getElementById('type-chips');
  el.innerHTML=ALL_TYPES.map(t=>'<button class="chip" data-v="'+t+'">'+t+'</button>').join('');
  el.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{
    const v=ch.dataset.v;
    if(selType.has(v)){selType.delete(v);ch.classList.remove('active');}
    else{selType.add(v);ch.classList.add('active');}
    renderLists();
  }));
  document.getElementById('type-filter').style.display='block';
}

async function init(){
  try{
    try{
      const res = await fetch('data-full.json?v='+Date.now());
      const data = await res.json();
      data.programs.forEach(p => { bySlug[p.file.replace(/\.html$/,'')] = p.types||[]; });
    }catch(e){ console.warn('data-full.json 로드 실패', e); }

    const snap = await getDocs(collection(db, 'playlists'));
    snap.forEach(d => {
      const data = d.data();
      const items = data.items||[];
      const types = new Set();
      items.forEach(it => (bySlug[it.slug]||[]).forEach(t=>types.add(t)));
      const tab = d.id.startsWith(BRIEFING_PREFIX) ? '브리핑' : '클라이언트';
      allLists.push({ name: d.id, count: items.length, updated: data.updated_at || '', types, tab });
    });
    allLists.sort((a,b) => (b.updated||'').localeCompare(a.updated||''));
    document.getElementById('loading').style.display = 'none';
    document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      renderLists();
    }));
    if (allLists.length === 0){
      document.getElementById('empty-state').style.display = 'block';
      document.getElementById('count-badge').innerHTML = '재생목록 <strong>0</strong>개';
      return;
    }
    buildTypeChips();
    renderLists();
  }catch(e){
    console.error(e);
    document.getElementById('loading').innerHTML = '데이터를 불러올 수 없습니다: ' + esc(e.message);
  }
}
init();
</script>

<div class="fab-wrap" style="position:fixed;right:28px;bottom:32px;z-index:160;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:12px;">
  <button class="fab-main" id="fab-main" style="width:54px;height:54px;border-radius:50%;background:#0B1020;color:#fff;border:none;font-size:26px;font-weight:300;cursor:pointer;box-shadow:0 4px 16px rgba(11,16,32,.18);transition:.18s;display:flex;align-items:center;justify-content:center;line-height:1;">+</button>
  <div class="fab-menu" id="fab-menu" style="display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;">
    <a class="fab-item" href="full.html" style="display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #E3E8F0;color:#0B1020;font-size:13.5px;font-weight:600;padding:11px 16px;border-radius:12px;text-decoration:none;box-shadow:0 4px 16px rgba(11,16,32,.1);white-space:nowrap;">📄 전체 지원사업</a>
    <a class="fab-item" href="lists.html" style="display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #E3E8F0;color:#0B1020;font-size:13.5px;font-weight:600;padding:11px 16px;border-radius:12px;text-decoration:none;box-shadow:0 4px 16px rgba(11,16,32,.1);white-space:nowrap;">📁 큐레이션 리스트</a>
  </div>
</div>
<script>
  (function(){
    var m=document.getElementById('fab-main'),menu=document.getElementById('fab-menu');
    if(!m)return;
    m.addEventListener('click',function(){var o=menu.classList.toggle('show');menu.style.opacity=o?'1':'0';menu.style.transform=o?'translateY(0)':'translateY(10px)';menu.style.pointerEvents=o?'auto':'none';m.style.transform=o?'rotate(45deg)':'none';});
  })();
</script>
<style>body.share-mode .fab-wrap{display:none;}</style>
</body>
</html>
