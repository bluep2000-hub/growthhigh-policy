# 푸시할 때마다 새 검토서에 D-day 자동 계산(dday.js + data-deadline)을 연결한다.
name: dday-inject
on:
  push:
    branches: [main]
    paths: ['[0-9]*.html', 'data-full.json']
permissions:
  contents: write
  pages: write
concurrency: dday-inject
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools_dday_inject.py
      - name: 바뀐 검토서가 있으면 커밋하고 Pages 재빌드
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "D-day 자동 계산 연결 (자동)"
          git pull --rebase && git push
          # GITHUB_TOKEN 푸시는 Pages 빌드를 띄우지 않으므로 직접 요청
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
