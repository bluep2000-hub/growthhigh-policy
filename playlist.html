<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growth'High 재생목록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  :root{--accent:#2563EB;--accent-soft:#EEF4FF;--line:#EEF0F2;--line-card:#E8EAEE;--ink-900:#0A0A0A;--ink-700:#1F2937;--ink-500:#4B5563;--ink-400:#6B7280;--ink-300:#9CA3AF;--urgent:#C73E2C;--urgent-soft:#FBEEEC;--warning:#B45309;--warning-soft:#FEF3E2;--closed:#9CA3AF;--shadow-sm:0 1px 2px rgba(15,23,42,.04);--shadow-lg:0 8px 24px rgba(15,23,42,.08),0 2px 6px rgba(15,23,42,.04);}
  body{background:#fff;color:var(--ink-700);}
  .doc{max-width:1040px;margin:0 auto;padding:32px 32px 96px;}
  .brand-header{display:flex;align-items:center;justify-content:space-between;padding:0 0 20px;margin-bottom:32px;border-bottom:1px solid var(--line);}
  .nav-links{display:flex;gap:8px;}
  .nav-links a{font-size:13px;font-weight:600;color:var(--ink-500);text-decoration:none;padding:9px 14px;border-radius:10px;transition:all .15s;white-space:nowrap;}
  .nav-links a:hover{background:#F4F5F7;color:var(--ink-900);}
  .nav-links a.active{background:var(--accent-soft);color:var(--accent);}
  .brand-mark{display:flex;align-items:center;gap:10px;}
  .brand-mark .brand-logo{width:32px;height:32px;object-fit:contain;}
  .brand-mark .wordmark{font-size:17px;font-weight:800;letter-spacing:-.04em;color:var(--ink-900);}
  .brand-mark .apostrophe{color:var(--urgent);font-weight:800;}
  .brand-mark .tagline{font-size:11px;font-weight:500;color:var(--ink-300);padding-left:12px;margin-left:4px;border-left:1px solid #E5E7EB;}
  .client-hero{padding:8px 0 32px;}
  .client-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700;border-radius:999px;margin-bottom:16px;letter-spacing:-.01em;}
  .client-title{font-size:36px;font-weight:800;letter-spacing:-.045em;color:var(--ink-900);margin-bottom:12px;line-height:1.15;}
  .client-title .accent{color:var(--accent);}
  .client-desc{font-size:15px;color:var(--ink-500);line-height:1.6;}
  .share-bar{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap;}
  .copy-btn{font-size:13px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:10px;padding:10px 16px;cursor:pointer;transition:all .15s;}
  .copy-btn:hover{background:#1D4ED8;}
  .copy-hint{font-size:12px;color:var(--ink-400);}
  body.share-mode .share-bar{display:none;}
  .controls{margin:24px 0 32px;padding:18px 20px;background:#fff;border:1px solid var(--line-card);border-radius:16px;box-shadow:var(--shadow-sm);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
  .result-count{font-size:13px;color:var(--ink-500);}
  .result-count strong{color:var(--ink-900);font-weight:700;}
  .chip{font-family:inherit;font-size:13px;font-weight:500;padding:7px 14px;background:#FAFBFC;border:1px solid var(--line);border-radius:10px;color:var(--ink-500);cursor:pointer;transition:all .15s;user-select:none;}
  .chip:hover{border-color:var(--ink-400);color:var(--ink-700);}
  .chip.active{background:var(--ink-900);border-color:var(--ink-900);color:#fff;}
  .section-header-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:0 4px;}
  .section-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
  .section-dot.closed{background:var(--closed);}
  .section-title{font-size:16px;font-weight:700;letter-spacing:-.02em;color:var(--ink-900);}
  .section-count{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--ink-400);margin-left:auto;}
  .program-section{margin-bottom:40px;}
  .program-section.hidden{display:none;}
  .program-list{display:grid;gap:12px;}
  .program-card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line-card);border-radius:16px;padding:22px 26px;transition:all .2s;box-shadow:var(--shadow-sm);}
  .program-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:#D1D5DB;}
  .program-card.is-closed{opacity:.72;}.program-card.is-closed:hover{opacity:1;}
  .card-row{display:flex;gap:22px;align-items:flex-start;}
  .card-status{flex-shrink:0;width:78px;text-align:center;padding:12px 8px;border-radius:12px;background:#F4F5F7;}
  .card-status.urgent{background:var(--urgent-soft);}.card-status.warning{background:var(--warning-soft);}.card-status.closed{background:#ECEDEF;}
  .card-dday{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1;}
  .card-status.urgent .card-dday{color:var(--urgent);}.card-status.warning .card-dday{color:var(--warning);}
  .card-status.closed .card-dday{color:var(--closed);font-size:13px;font-weight:700;padding-top:4px;}
  .card-status-label{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:4px;}
  .card-status.urgent .card-status-label{color:var(--urgent);}.card-status.warning .card-status-label{color:var(--warning);}.card-status.closed .card-status-label{color:var(--closed);}
  .card-body-wrap{flex:1;min-width:0;}
  .card-tags{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .card-tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:8px;}
  .card-tag.sub{background:#ECFDF5;color:#047857;}.card-tag.alt{background:#F3F4F6;color:var(--ink-500);}
  .card-tag.type{background:#FEF3E2;color:#B45309;}
  .card-title{font-size:18px;font-weight:700;letter-spacing:-.03em;line-height:1.32;margin-bottom:8px;color:var(--ink-900);}
  .card-summary{font-size:13.5px;color:var(--ink-500);line-height:1.6;margin-bottom:12px;}
  .card-meta-list{display:flex;gap:18px;font-size:12px;color:var(--ink-400);flex-wrap:wrap;}
  .card-meta-list strong{color:var(--ink-500);font-weight:600;margin-right:6px;}
  .sent-log{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:5px 11px;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;font-size:11.5px;font-weight:600;color:#047857;font-family:'JetBrains Mono',monospace;letter-spacing:-.01em;}
  .card-arrow{flex-shrink:0;align-self:center;font-size:18px;color:var(--ink-300);transition:all .2s;}
  .program-card:hover .card-arrow{color:var(--accent);transform:translateX(3px);}
  .empty-state{padding:56px 24px;background:#fff;border:1px dashed #D1D5DB;border-radius:16px;text-align:center;color:var(--ink-500);font-size:14px;}
  .empty-state strong{display:block;color:var(--ink-900);font-size:16px;margin-bottom:6px;font-weight:700;}
  .doc-footer{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .footer-brand{font-size:12px;font-weight:700;color:var(--ink-500);}.footer-brand .apostrophe{color:var(--urgent);}
  .footer-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-400);text-align:right;line-height:1.6;}
  @media(max-width:720px){.doc{padding:24px 16px 60px;}.client-title{font-size:27px;}.program-card{padding:18px;}.card-row{flex-direction:column;gap:14px;}.card-status{width:100%;display:flex;gap:12px;align-items:center;padding:10px 14px;}.card-status-label{margin-top:0;}.card-arrow{display:none;}}
</style>
</head>
<body>
<div class="doc">
  <header class="brand-header">
    <div class="brand-mark">
      <img src="logo.png" alt="GROWTH'HIGH" class="brand-logo" onerror="this.style.display='none'">
      <span class="wordmark">GROWTH<span class="apostrophe">'</span>HIGH</span>
      <span class="tagline">Scale-up Studio</span>
    </div>
    <nav class="nav-links" id="nav-links">
      <a href="full.html">전체 큐레이션</a>
      <a href="lists.html" class="active">재생목록</a>
    </nav>
  </header>

  <div class="client-hero">
    <div class="client-badge">PLAYLIST</div>
    <h1 class="client-title" id="client-title">— 큐레이션</h1>
    <p class="client-desc" id="client-desc">담당 컨설턴트가 선별하여 보낸 맞춤 지원사업입니다.</p>
    <div class="share-bar" id="share-bar"><button class="copy-btn" id="copy-btn">🔗 클라이언트 공유 링크 복사</button><span class="copy-hint">이 버튼은 클라이언트 화면에는 보이지 않습니다</span></div>
  </div>

  <div class="controls" id="type-controls" style="display:flex;flex-direction:column;align-items:stretch;gap:12px;">
    <div style="display:flex;flex-wrap:wrap;gap:6px;" id="type-chips"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;">
      <div class="result-count" id="result-count"></div>
      <button id="type-reset" style="font-size:12.5px;font-weight:600;color:var(--ink-400);background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:8px;">↺ 유형 해제</button>
    </div>
  </div>

  <section class="program-section" id="active-section">
    <div class="section-header-row"><span class="section-dot"></span><div class="section-title">진행 중인 사업</div><div class="section-count" id="active-cnt">0</div></div>
    <div class="program-list" id="active-list"></div>
  </section>

  <section class="program-section" id="closed-section">
    <div class="section-header-row"><span class="section-dot closed"></span><div class="section-title">종료된 사업 (참고용)</div><div class="section-count" id="closed-cnt">0</div></div>
    <div class="program-list" id="closed-list"></div>
  </section>

  <div class="empty-state" id="empty-state" style="display:none;">
    <strong>아직 전송된 사업이 없습니다</strong>
    담당 컨설턴트가 선별한 사업이 여기에 표시됩니다.
  </div>

  <footer class="doc-footer">
    <div class="footer-brand">GROWTH<span class="apostrophe">'</span>HIGH — Scale-up Studio</div>
    <div class="footer-meta">Curated by GROWTH'HIGH<br><span id="footer-updated"></span></div>
  </footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let state = { bySlug: {}, list: '', items: [], selType: new Set() };
const ALL_TYPES = ['R&D','창업','판로수출','인력','정책자금','인증','투자유치'];

function calcDday(iso){ if(!iso)return 9999; const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}); const u=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);}; return Math.round((u(fmt.format(new Date(iso)))-u(fmt.format(new Date())))/86400000); }
function getStatus(dd){ if(dd<0)return'closed'; if(dd<=3)return'urgent'; if(dd<=7)return'warning'; return'active'; }
function statusLabel(dd,st){ if(st==='closed')return'REF'; if(st==='urgent')return'URGENT'; if(st==='warning')return'WARNING'; return'ACTIVE'; }
function ddayText(dd,st){ if(st==='closed')return'CLOSED'; if(dd===0)return'D−0'; if(dd>=9999)return'상시'; return'D−'+dd; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderCard(p, addedAt){
  const dd=calcDday(p.deadline_iso), st=getStatus(dd);
  const sub=(p.sub_industries||[]).map(s=>'<span class="card-tag sub">'+esc(s)+'</span>').join('');
  const typ=(p.types||[]).map(t=>'<span class="card-tag type">'+esc(t)+'</span>').join('');
  const tags=typ+sub+(p.tags||[]).map((t,i)=>'<span class="card-tag'+(i===0?'':' alt')+'">'+esc(t)+'</span>').join('');
  const meta=Object.entries(p.meta||{}).map(([k,v])=>'<span><strong>'+esc(k)+'</strong>'+esc(v)+'</span>').join('');
  const log=addedAt?'<div class="sent-log">✓ '+esc(addedAt)+' 추가됨</div>':'';
  return '<a href="'+esc(p.file)+'" target="_blank" rel="noopener" class="program-card'+(st==='closed'?' is-closed':'')+'"><div class="card-row"><div class="card-status '+st+'"><div class="card-dday">'+ddayText(dd,st)+'</div><div class="card-status-label">'+statusLabel(dd,st)+'</div></div><div class="card-body-wrap"><div class="card-tags">'+tags+'</div><h3 class="card-title">'+esc(p.title)+'</h3><p class="card-summary">'+esc(p.summary||'')+'</p><div class="card-meta-list">'+meta+'</div>'+log+'</div><div class="card-arrow">→</div></div></a>';
}

function buildTypeChips(){
  const el=document.getElementById('type-chips');
  el.innerHTML=ALL_TYPES.map(t=>'<button class="chip'+(state.selType.has(t)?' active':'')+'" data-v="'+t+'">'+t+'</button>').join('');
  el.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{
    const v=ch.dataset.v;
    if(state.selType.has(v)){state.selType.delete(v);ch.classList.remove('active');}
    else{state.selType.add(v);ch.classList.add('active');}
    render();
  }));
  document.getElementById('type-reset').addEventListener('click',()=>{
    state.selType.clear();
    el.querySelectorAll('.chip.active').forEach(c=>c.classList.remove('active'));
    render();
  });
}

function render(){
  let rows = state.items.map(it => ({ p: state.bySlug[it.slug], added: it.added_at })).filter(r => r.p);
  if(state.selType.size) rows = rows.filter(r => (r.p.types||[]).some(t=>state.selType.has(t)));
  const active=[], closed=[];
  rows.forEach(r => { (getStatus(calcDday(r.p.deadline_iso))==='closed'?closed:active).push(r); });
  active.sort((a,b)=>calcDday(a.p.deadline_iso)-calcDday(b.p.deadline_iso));
  closed.sort((a,b)=>calcDday(b.p.deadline_iso)-calcDday(a.p.deadline_iso));
  document.getElementById('active-list').innerHTML=active.map(r=>renderCard(r.p,r.added)).join('');
  document.getElementById('closed-list').innerHTML=closed.map(r=>renderCard(r.p,r.added)).join('');
  document.getElementById('active-cnt').textContent=active.length;
  document.getElementById('closed-cnt').textContent=closed.length;
  document.getElementById('active-section').classList.toggle('hidden',active.length===0);
  document.getElementById('closed-section').classList.toggle('hidden',closed.length===0);
  document.getElementById('empty-state').style.display=rows.length===0?'block':'none';
  const totalInList = state.items.filter(it=>state.bySlug[it.slug]).length;
  const rc=document.getElementById('result-count');
  if(state.selType.size) rc.innerHTML='<strong>'+totalInList+'</strong>개 中 <strong>'+rows.length+'</strong>개 표시 (진행 '+active.length+' · 종료 '+closed.length+')';
  else rc.innerHTML='전체 <strong>'+rows.length+'</strong>개 (진행 '+active.length+' · 종료 '+closed.length+')';
}

async function init(){
  try{
    const res = await fetch('data-full.json?v='+Date.now());
    const data = await res.json();
    data.programs.forEach(p => { state.bySlug[p.file.replace(/\.html$/,'')] = p; });
    const params = new URLSearchParams(location.search);
    state.list = params.get('list') || '';
    const shareMode = params.get('share') === '1';
    if (shareMode) {
      document.body.classList.add('share-mode');
      const nav = document.getElementById('nav-links'); if (nav) nav.style.display = 'none';
    } else {
      const cb = document.getElementById('copy-btn');
      if (cb) cb.addEventListener('click', () => {
        const url = location.origin + location.pathname + '?list=' + encodeURIComponent(state.list) + '&share=1';
        navigator.clipboard.writeText(url).then(() => { cb.textContent = '✓ 복사됨'; setTimeout(() => cb.textContent = '🔗 클라이언트 공유 링크 복사', 1800); });
      });
    }
    document.getElementById('client-title').innerHTML = esc(state.list) + ' <span class="accent">재생목록</span>';
    document.getElementById('client-desc').textContent = '담당 컴설턴트가 선별한 맞춤 지원사업입니다.';
    if (state.list) {
      const snap = await getDoc(doc(db, 'playlists', state.list));
      state.items = snap.exists() ? (snap.data().items || []) : [];
    }
    buildTypeChips();
    render();
  }catch(e){ console.error(e); document.getElementById('active-list').innerHTML='<div class="empty-state"><strong>데이터를 불러올 수 없습니다</strong></div>'; }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init); else init();
</script>
</body>
</html>
