<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growth'High 재생목록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  :root{
    --brand:#1246D6; --brand-dark:#0E37A8; --brand-soft:#EEF3FF; --brand-line:#D6E1FF;
    --accent:#1246D6; --accent-soft:#EEF3FF;
    --ink-900:#0B1020; --ink-700:#2A3145; --ink-500:#5A6478; --ink-400:#8A93A6; --ink-300:#B4BBC9;
    --bg:#FFFFFF; --bg-soft:#F7F9FC; --line:#EAEEF4; --line-card:#E3E8F0;
    --urgent:#E0431F; --urgent-soft:#FDEEEA; --warn:#B45309; --warn-soft:#FEF4E5; --closed:#9AA3B2;
    --ok:#0E9F6E; --ok-soft:#E7F8F1;
    --sh-sm:0 1px 2px rgba(11,16,32,.04);
    --sh-md:0 4px 16px rgba(11,16,32,.06),0 1px 3px rgba(11,16,32,.04);
    --r:18px;
  }
  *{box-sizing:border-box;}
  body{font-family:'Pretendard Variable',Pretendard,sans-serif;background:var(--bg);color:var(--ink-700);margin:0;-webkit-font-smoothing:antialiased;}
  .doc{max-width:1120px;margin:0 auto;padding:0 28px 140px;}
  .brand-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px 0;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);}
  .brand-mark{display:flex;align-items:center;gap:11px;}
  .brand-mark .brand-logo{width:30px;height:30px;object-fit:contain;border-radius:8px;}
  .brand-mark .wordmark{font-size:17px;font-weight:800;letter-spacing:-.045em;color:var(--ink-900);}
  .brand-mark .apostrophe{color:var(--urgent);font-weight:800;}
  .brand-mark .tagline{font-size:11px;font-weight:600;color:var(--ink-300);padding-left:11px;margin-left:3px;border-left:1px solid var(--line);}
  .nav-links{display:none;}
  .client-hero{padding:40px 0 28px;}
  .client-badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--brand);background:var(--brand-soft);padding:6px 12px;border-radius:999px;margin-bottom:16px;}
  .client-title{font-size:40px;font-weight:800;letter-spacing:-.045em;color:var(--ink-900);margin:0 0 12px;line-height:1.12;}
  .client-title .accent{color:var(--brand);}
  .client-desc{font-size:15px;color:var(--ink-500);line-height:1.6;margin:0;}
  .share-bar{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap;}
  .copy-btn{font-size:13px;font-weight:700;color:#fff;background:var(--ink-900);border:none;border-radius:10px;padding:10px 16px;cursor:pointer;transition:.15s;}
  .copy-btn:hover{background:#1A2236;}
  .copy-hint{font-size:12px;color:var(--ink-400);}
  body.share-mode .share-bar{display:none;}
  .controls{margin-top:8px;display:flex;flex-direction:column;gap:14px;padding:20px;background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--r);}
  .chip{font-family:inherit;font-size:13px;font-weight:600;padding:8px 15px;background:#fff;border:1px solid var(--line-card);border-radius:999px;color:var(--ink-500);cursor:pointer;transition:.15s;}
  .chip:hover{border-color:var(--ink-400);color:var(--ink-700);}
  .chip.active{background:var(--ink-900);border-color:var(--ink-900);color:#fff;}
  .result-count{font-size:13px;color:var(--ink-500);}
  .result-count strong{color:var(--ink-900);font-weight:700;}
  .program-section{margin-top:36px;}
  .program-section.hidden{display:none;}
  .section-header-row{display:flex;align-items:center;gap:9px;margin-bottom:16px;}
  .section-dot{width:7px;height:7px;border-radius:50%;background:var(--brand);}
  .section-dot.closed{background:var(--closed);}
  .section-title{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--ink-900);}
  .section-count{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--ink-400);margin-left:auto;}
  .program-list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .program-card{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line-card);border-radius:var(--r);padding:24px;transition:.18s;box-shadow:var(--sh-sm);}
  .program-card:hover{box-shadow:var(--sh-md);border-color:var(--ink-300);}
  .program-card.is-closed{opacity:.66;}
  .program-card.is-closed:hover{opacity:1;}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px;}
  .card-tags{display:flex;gap:6px;flex-wrap:wrap;}
  .card-tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;}
  .card-tag.type{background:var(--warn-soft);color:var(--warn);}
  .card-tag.sub{background:var(--ok-soft);color:var(--ok);}
  .card-tag.alt{background:#F1F3F7;color:var(--ink-500);}
  .card-dday{flex-shrink:0;text-align:center;min-width:56px;padding:8px 10px;border-radius:12px;background:var(--bg-soft);}
  .card-dday .dv{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--ink-700);}
  .card-dday.urgent{background:var(--urgent-soft);}.card-dday.urgent .dv{color:var(--urgent);}
  .card-dday.warning{background:var(--warn-soft);}.card-dday.warning .dv{color:var(--warn);}
  .card-dday.closed{background:#EEF0F3;}.card-dday.closed .dv{font-size:13px;color:var(--closed);}
  .card-title{font-size:16.5px;font-weight:700;letter-spacing:-.03em;line-height:1.35;color:var(--ink-900);margin:0 0 8px;}
  .card-summary{font-size:13px;color:var(--ink-500);line-height:1.6;margin:0 0 16px;flex:1;}
  .card-meta-list{display:flex;gap:16px;font-size:12px;color:var(--ink-400);flex-wrap:wrap;}
  .card-meta-list span{display:inline-flex;gap:5px;}
  .card-meta-list strong{color:var(--ink-400);font-weight:600;}
  .card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  .sent-log{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#047857;font-family:'JetBrains Mono',monospace;letter-spacing:-.01em;}
  .remove-btn{flex-shrink:0;font-size:12px;font-weight:600;color:#9AA3B2;background:#fff;border:1px solid var(--line-card);border-radius:8px;padding:6px 12px;cursor:pointer;transition:.15s;position:relative;z-index:5;}
  .remove-btn:hover{color:var(--urgent);border-color:#F3C0B6;background:var(--urgent-soft);}
  body.share-mode .remove-btn{display:none;}
  .empty-state{padding:56px 24px;background:#fff;border:1px dashed var(--line-card);border-radius:var(--r);text-align:center;color:var(--ink-500);font-size:14px;}
  .empty-state strong{display:block;color:var(--ink-900);font-size:16px;margin-bottom:6px;font-weight:700;}
  @media(max-width:720px){
    .doc{padding:0 16px 80px;}
    .program-list{grid-template-columns:1fr;}
    .client-title{font-size:28px;}
  }
</style>
</head>
<body>
<div class="doc">
  <header class="brand-header">
    <div class="brand-mark">
      <img src="logo.png" alt="GROWTH'HIGH" class="brand-logo" onerror="this.style.display='none'">
      <span class="wordmark">GROWTH<span class="apostrophe">'</span>HIGH</span>
      <span class="tagline">Scale-up Studio</span>
    </div>
  </header>

  <div class="client-hero">
    <div class="client-badge">Curation List</div>
    <h1 class="client-title" id="client-title">— 큐레이션</h1>
    <p class="client-desc" id="client-desc">담당 컨설턴트가 선별하여 보낸 맞춤 지원사업입니다.</p>
    <div class="share-bar" id="share-bar"><button class="copy-btn" id="copy-btn">🔗 클라이언트 공유 링크 복사</button><span class="copy-hint">이 버튼은 클라이언트 화면에는 보이지 않습니다</span></div>
  </div>

  <div class="controls" id="type-controls" style="display:flex;flex-direction:column;align-items:stretch;gap:12px;">
    <div style="display:flex;flex-wrap:wrap;gap:6px;" id="type-chips"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;">
      <div class="result-count" id="result-count"></div>
      <button id="type-reset" style="font-size:12.5px;font-weight:600;color:var(--ink-400);background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:8px;">↺ 유형 해제</button>
    </div>
  </div>

  <section class="program-section" id="active-section">
    <div class="section-header-row"><span class="section-dot"></span><div class="section-title">진행 중인 사업</div><div class="section-count" id="active-cnt">0</div></div>
    <div class="program-list" id="active-list"></div>
  </section>

  <section class="program-section" id="closed-section">
    <div class="section-header-row"><span class="section-dot closed"></span><div class="section-title">종료된 사업 (참고용)</div><div class="section-count" id="closed-cnt">0</div></div>
    <div class="program-list" id="closed-list"></div>
  </section>

  <div class="empty-state" id="empty-state" style="display:none;">
    <strong>아직 전송된 사업이 없습니다</strong>
    담당 컨설턴트가 선별한 사업이 여기에 표시됩니다.
  </div>

  <footer class="doc-footer">
    <div class="footer-brand">GROWTH<span class="apostrophe">'</span>HIGH — Scale-up Studio</div>
    <div class="footer-meta">Curated by GROWTH'HIGH<br><span id="footer-updated"></span></div>
  </footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let state = { bySlug: {}, list: '', items: [], selType: new Set() };
const ALL_TYPES = ['R&D','창업','판로수출','인력','정책자금','인증','투자유치'];

function calcDday(iso){ if(!iso)return 9999; const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}); const u=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);}; return Math.round((u(fmt.format(new Date(iso)))-u(fmt.format(new Date())))/86400000); }
function getStatus(dd){ if(dd<0)return'closed'; if(dd<=3)return'urgent'; if(dd<=7)return'warning'; return'active'; }
function statusLabel(dd,st){ if(st==='closed')return'REF'; if(st==='urgent')return'URGENT'; if(st==='warning')return'WARNING'; return'ACTIVE'; }
function ddayText(dd,st){ if(st==='closed')return'CLOSED'; if(dd===0)return'D−0'; if(dd>=9999)return'상시'; return'D−'+dd; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderCard(p, addedAt){
  const dd=calcDday(p.deadline_iso), st=getStatus(dd);
  const sub=(p.sub_industries||[]).map(s=>'<span class="card-tag sub">'+esc(s)+'</span>').join('');
  const typ=(p.types||[]).map(t=>'<span class="card-tag type">'+esc(t)+'</span>').join('');
  const tags=typ+sub;
  const meta=Object.entries(p.meta||{}).map(([k,v])=>'<span><strong>'+esc(k)+'</strong>'+esc(v)+'</span>').join('');
  const slug=p.file.replace(/\.html$/,'');
  const ddayCls = st==='closed'?'closed':(st==='urgent'?'urgent':(st==='warning'?'warning':''));
  const ddayVal = st==='closed'?'\uc885\ub8cc':ddayText(dd,st);
  const log=addedAt?'<div class="sent-log">\u2713 '+esc(addedAt)+' \ucd94\uac00\ub428</div>':'<span></span>';
  const rmBtn='<button class="remove-btn" onclick="window.removeFromList(event,\''+esc(slug)+'\')">\u2212 \uc7ac\uc0dd\ubaa9\ub85d\uc5d0\uc11c \ube7c\uae30</button>';
  return '<a href="'+esc(p.file)+'" target="_blank" rel="noopener" class="program-card'+(st==='closed'?' is-closed':'')+'">'+
    '<div class="card-head"><div class="card-tags">'+tags+'</div><div class="card-dday '+ddayCls+'"><div class="dv">'+ddayVal+'</div></div></div>'+
    '<h3 class="card-title">'+esc(p.title)+'</h3>'+
    '<p class="card-summary">'+esc(p.summary||'')+'</p>'+
    '<div class="card-meta-list">'+meta+'</div>'+
    '<div class="card-foot">'+log+rmBtn+'</div></a>';
}

function buildTypeChips(){
  const el=document.getElementById('type-chips');
  el.innerHTML=ALL_TYPES.map(t=>'<button class="chip'+(state.selType.has(t)?' active':'')+'" data-v="'+t+'">'+t+'</button>').join('');
  el.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{
    const v=ch.dataset.v;
    if(state.selType.has(v)){state.selType.delete(v);ch.classList.remove('active');}
    else{state.selType.add(v);ch.classList.add('active');}
    render();
  }));
  document.getElementById('type-reset').addEventListener('click',()=>{
    state.selType.clear();
    el.querySelectorAll('.chip.active').forEach(c=>c.classList.remove('active'));
    render();
  });
}

window.removeFromList = async function(ev, slug){
  ev.preventDefault(); ev.stopPropagation();
  if(!confirm('이 사업을 재생목록에서 뫏까요?')) return;
  try{
    const today = new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'});
    state.items = state.items.filter(it => it.slug !== slug);
    await setDoc(doc(db,'playlists',state.list), { items: state.items, updated_at: today }, { merge:true });
    render();
  }catch(e){ console.error(e); alert('빼기 실패: '+e.message); }
};

function render(){
  let rows = state.items.map(it => ({ p: state.bySlug[it.slug], added: it.added_at })).filter(r => r.p);
  if(state.selType.size) rows = rows.filter(r => (r.p.types||[]).some(t=>state.selType.has(t)));
  const active=[], closed=[];
  rows.forEach(r => { (getStatus(calcDday(r.p.deadline_iso))==='closed'?closed:active).push(r); });
  active.sort((a,b)=>calcDday(a.p.deadline_iso)-calcDday(b.p.deadline_iso));
  closed.sort((a,b)=>calcDday(b.p.deadline_iso)-calcDday(a.p.deadline_iso));
  document.getElementById('active-list').innerHTML=active.map(r=>renderCard(r.p,r.added)).join('');
  document.getElementById('closed-list').innerHTML=closed.map(r=>renderCard(r.p,r.added)).join('');
  document.getElementById('active-cnt').textContent=active.length;
  document.getElementById('closed-cnt').textContent=closed.length;
  document.getElementById('active-section').classList.toggle('hidden',active.length===0);
  document.getElementById('closed-section').classList.toggle('hidden',closed.length===0);
  document.getElementById('empty-state').style.display=rows.length===0?'block':'none';
  const totalInList = state.items.filter(it=>state.bySlug[it.slug]).length;
  const rc=document.getElementById('result-count');
  if(state.selType.size) rc.innerHTML='<strong>'+totalInList+'</strong>개 中 <strong>'+rows.length+'</strong>개 표시 (진행 '+active.length+' · 종료 '+closed.length+')';
  else rc.innerHTML='전체 <strong>'+rows.length+'</strong>개 (진행 '+active.length+' · 종료 '+closed.length+')';
}

async function init(){
  try{
    const res = await fetch('data-full.json?v='+Date.now());
    const data = await res.json();
    data.programs.forEach(p => { state.bySlug[p.file.replace(/\.html$/,'')] = p; });
    const params = new URLSearchParams(location.search);
    state.list = params.get('list') || '';
    const shareMode = params.get('share') === '1';
    if (shareMode) {
      document.body.classList.add('share-mode');
      const nav = document.getElementById('nav-links'); if (nav) nav.style.display = 'none';
    } else {
      const cb = document.getElementById('copy-btn');
      if (cb) cb.addEventListener('click', () => {
        const url = location.origin + location.pathname + '?list=' + encodeURIComponent(state.list) + '&share=1';
        navigator.clipboard.writeText(url).then(() => { cb.textContent = '✓ 복사됨'; setTimeout(() => cb.textContent = '🔗 클라이언트 공유 링크 복사', 1800); });
      });
    }
    document.getElementById('client-title').innerHTML = esc(state.list) + ' <span class="accent">정부지원사업 큐레이션 리스트</span>';
    document.getElementById('client-desc').textContent = '담당 컨설턴트가 선별한 맞춤 지원사업입니다.';
    if (state.list) {
      const snap = await getDoc(doc(db, 'playlists', state.list));
      state.items = snap.exists() ? (snap.data().items || []) : [];
    }
    buildTypeChips();
    render();
  }catch(e){ console.error(e); document.getElementById('active-list').innerHTML='<div class="empty-state"><strong>데이터를 불러올 수 없습니다</strong></div>'; }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init); else init();
</script>

<div class="fab-wrap" style="position:fixed;right:28px;bottom:32px;z-index:160;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:12px;">
  <button class="fab-main" id="fab-main" style="width:54px;height:54px;border-radius:50%;background:#0B1020;color:#fff;border:none;font-size:26px;font-weight:300;cursor:pointer;box-shadow:0 4px 16px rgba(11,16,32,.18);transition:.18s;display:flex;align-items:center;justify-content:center;line-height:1;">+</button>
  <div class="fab-menu" id="fab-menu" style="display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;">
    <a class="fab-item" href="full.html" style="display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #E3E8F0;color:#0B1020;font-size:13.5px;font-weight:600;padding:11px 16px;border-radius:12px;text-decoration:none;box-shadow:0 4px 16px rgba(11,16,32,.1);white-space:nowrap;">📄 전체 지원사업</a>
    <a class="fab-item" href="lists.html" style="display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #E3E8F0;color:#0B1020;font-size:13.5px;font-weight:600;padding:11px 16px;border-radius:12px;text-decoration:none;box-shadow:0 4px 16px rgba(11,16,32,.1);white-space:nowrap;">📁 큐레이션 리스트</a>
  </div>
</div>
<script>
  (function(){
    var m=document.getElementById('fab-main'),menu=document.getElementById('fab-menu');
    if(!m)return;
    m.addEventListener('click',function(){var o=menu.classList.toggle('show');menu.style.opacity=o?'1':'0';menu.style.transform=o?'translateY(0)':'translateY(10px)';menu.style.pointerEvents=o?'auto':'none';m.style.transform=o?'rotate(45deg)':'none';});
  })();
</script>
<style>body.share-mode .fab-wrap{display:none;}</style>
</body>
</html>
